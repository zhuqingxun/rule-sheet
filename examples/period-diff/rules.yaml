# 与 规则_决策表.xlsx 完全相同的一组规则, 换成 YAML 写法。
# 两者由同一个解释器执行:  uv run rule-sheet run examples/period-diff/rules.yaml
#
# 这个样例展示 0.7 加的两件事:
#   - 差异(本期, 上期, 对比字段): 字段组里的每一列逐个比两期的同名列, 变化的拼成 字段:旧值->新值, 多个用 ; 接, 没变化为空;
#     相等判定与审计列同一套 (空串与空值相同, 文本严格), 空值显示为空串 (拟任人:李四->)
#   - 独有行: 追加: 上期有本期没有的岗位接到输出末尾, 同名列带入, 本期.存在 在这些行上是 否
#   - 首次命中 下四条规则按顺序: 没了 / 新增 / 变了 / 没变

输入:
  本期: {文件: 本期全量.xlsx, 匹配: 主表}                      # 主表; 本期.存在 在追加来的行上是 否
  上期: {文件: 上期全量.xlsx, 匹配: 岗位编码, 独有行: 追加}       # 上期独有的岗位接到输出末尾

设置:
  输出: output/本期全量_更新后_yaml.xlsx

字段组:
  对比字段: [岗位名称, 岗位职级, 一层组织, 拟任人, 绩效]        # 两期要逐个比的列, 写一次

变量:
  变更明细: 差异(本期, 上期, 对比字段)                          # 岗位职级:21级->22级;绩效:A->B; 没变化为空

命中策略: 首次命中        # 四种差异互斥, 按顺序

规则:
  - 编号: D1
    名称: 上期有本期没有 (追加来的行)
    优先级: 1
    当:
      - 本期.存在 == 否
    则: {差异类型: REMOVED, 变更字段明细: 清空}

  - 编号: D2
    名称: 上期没有
    优先级: 2
    当:
      - 上期.存在 == 否
    则: {差异类型: ADDED, 变更字段明细: 清空}

  - 编号: D3
    名称: 有字段变了
    优先级: 3
    当:
      - 变更明细 != 空
    则: {差异类型: CHANGED, 变更字段明细: 变更明细}

  - 编号: D4
    名称: 兜底, 没变
    优先级: 4
    则: {差异类型: UNCHANGED, 变更字段明细: 清空}   # 变更字段明细 每次重算, 所以 D1 / D2 / D4 都显式清空

# 测试用例: 与 Excel 的「测试」sheet 一致。本期.存在 没给默认 是。
测试:
  - 用例: T1 两列变了, 按字段组顺序拼
    输入: {上期.存在: 是, 本期.岗位名称: 财务部-部长, 上期.岗位名称: 财务部-部长, 本期.岗位职级: 22级, 上期.岗位职级: 21级, 本期.拟任人: 张三, 上期.拟任人: 张三, 本期.绩效: B, 上期.绩效: A}
    期望: {差异类型: CHANGED, 变更字段明细: 岗位职级:21级->22级;绩效:A->B}

  - 用例: T2 上期没有
    输入: {上期.存在: 否, 本期.岗位名称: 市场部-经理, 本期.岗位职级: 19级, 本期.拟任人: 王五, 本期.绩效: C}
    期望: {差异类型: ADDED, 变更字段明细: 空}

  - 用例: T3 完全相同
    输入: {上期.存在: 是, 本期.岗位名称: 法务部-主管, 上期.岗位名称: 法务部-主管, 本期.岗位职级: 18级, 上期.岗位职级: 18级, 本期.拟任人: 赵六, 上期.拟任人: 赵六, 本期.绩效: B, 上期.绩效: B}
    期望: {差异类型: UNCHANGED, 变更字段明细: 空}

  - 用例: T4 追加来的行
    输入: {本期.存在: 否, 上期.存在: 是, 上期.岗位名称: 采购部-经理, 上期.岗位职级: 20级, 上期.拟任人: 周七, 上期.绩效: B}
    期望: {差异类型: REMOVED, 变更字段明细: 空}

  - 用例: T5 新值为空显示为空串
    输入: {上期.存在: 是, 本期.岗位名称: 人事部-部长, 上期.岗位名称: 人事部-部长, 本期.岗位职级: 20级, 上期.岗位职级: 20级, 上期.拟任人: 李四}
    期望: {差异类型: CHANGED, 变更字段明细: 拟任人:李四->}

  - 用例: T6 旧值为空显示为空串
    输入: {上期.存在: 是, 本期.岗位名称: 人事部-部长, 上期.岗位名称: 人事部-部长, 本期.岗位职级: 20级, 上期.岗位职级: 20级, 本期.拟任人: 王五}
    期望: {差异类型: CHANGED, 变更字段明细: 拟任人:->王五}

# 与 规则_决策表.xlsx 完全相同的一组规则, 换成 YAML 写法。
# 两者由同一个解释器执行:  uv run rule-sheet run examples/status-machine/rules.yaml
#
# 这个样例展示几件事:
#   - 字段名含 `-` (类别-会议 / 状态-会议), 在表达式里直接写, 不用转义
#   - 输出格 `清空`: 命中后把目标列写成空值 (区别于不写 / "-" 的不改)
#   - 命中策略 `首次命中`: 每行只听优先级数字最小的那条, 命中即停, 后面的规则不再看这一行
#   - 变量定义里用 且 / 或 组合条件; `!=` 两侧有空值就不成立 (与决策表单元格一致)
#   - 判空写 `x == 空` / `x != 空` (`为空(x)` / `非空(x)` 是同义写法); 空 只能和 == / != 搭配
#   - 跨变量的「或」: 决策表里 S3 写成两行同 ID, 这里写成 任一满足:

匹配:
  左表: 本期岗位.xlsx
  右表: 上期岗位.xlsx
  左表别名: 本期
  右表别名: 上期
  匹配键: 岗位编码
  输出: output/本期岗位_更新后_yaml.xlsx

变量:
  # != 两侧有空值就不成立, 所以「上期没填、本期填了」(新任命) 要单独写一支; 两期都空不算变化
  拟任人有变化: 本期.拟任人 != 上期.拟任人 或 (上期.拟任人 == 空 且 本期.拟任人 != 空)
  流程节点有变化: 本期.流程节点 != 上期.流程节点 或 (上期.流程节点 == 空 且 本期.流程节点 != 空)

命中策略: 首次命中        # 每行只算优先级数字最小的那条命中; 同优先级按书写顺序

规则:
  - 编号: S1
    名称: 本期不再上会, 清掉状态
    优先级: 1
    当:
      - 本期.类别-会议 == 空    # 判空; 为空(本期.类别-会议) 是同义写法
    则:
      状态-会议: 清空        # 写成空值 (也可写 空); 不写这一列 (或写 "-") 才是不改

  - 编号: S2
    名称: 酝酿中的岗位由人工维护, 不处理
    优先级: 2
    当:
      - 本期.类别-会议 == "近2个月酝酿及上会计划"
    # 没有 则: 什么都不改, 但命中即停, 后面的规则不再看这一行。
    # 换成 优先级 策略的话 S2 不占任何列, 这一行会被 S5 写成 01-新增 (用例 T2 守住这一点)。

  - 编号: S3
    名称: 类别与上期相同, 且拟任人或流程节点有变化, 记为进展更新
    优先级: 3
    当:
      - 本期.类别-会议 == 上期.类别-会议      # 上期没有这个岗位时右边为空, 比较不成立
      - 任一满足:                            # 决策表里对应 S3 的两行 (同 ID = 或)
          - 拟任人有变化
          - 流程节点有变化
    则:
      状态-会议: 02-进展更新

  - 编号: S4
    名称: 类别与上期相同, 没有变化, 按计划进行
    优先级: 4
    当:
      - 本期.类别-会议 == 上期.类别-会议
    则:
      状态-会议: 03-按计划进行

  - 编号: S5
    名称: 其余有类别的岗位都是新增
    优先级: 5
    # 没有 当: 无条件命中; 首次命中 下只有前面都没命中的行才会走到这里 (兜底)
    则:
      状态-会议: 01-新增

# 测试用例: 与 Excel 的「测试」sheet 一致。期望里没写的列 = 期望不变; 写 清空 = 期望该列为空。
测试:
  - 用例: T1 类别为空, 清掉状态
    输入: {本期.状态-会议: 01-新增, 上期.类别-会议: 变动通报}
    期望: {状态-会议: 清空}

  - 用例: T2 酝酿中, S2 拦截不动
    输入: {本期.类别-会议: 近2个月酝酿及上会计划}
    期望: {}

  - 用例: T3 类别相同, 拟任人变了, 进展更新
    输入: {本期.类别-会议: 变动通报, 本期.状态-会议: 01-新增, 上期.类别-会议: 变动通报, 本期.拟任人: 王五, 上期.拟任人: 张三, 本期.流程节点: 部门评审, 上期.流程节点: 部门评审}
    期望: {状态-会议: 02-进展更新}

  - 用例: T4 上期没有, 兜底新增
    输入: {本期.类别-会议: 变动通报}
    期望: {状态-会议: 01-新增}

  - 用例: T5 清空本来就空的格, 无变化
    输入: {}
    期望: {}

  - 用例: T6 类别变了, 重新计为新增
    输入: {本期.类别-会议: 变动通报, 本期.状态-会议: 02-进展更新, 上期.类别-会议: 近2个月酝酿及上会计划}
    期望: {状态-会议: 01-新增}

  - 用例: T7 类别相同, 流程节点变了 (任一满足 的另一支)
    输入: {本期.类别-会议: 变动通报, 本期.状态-会议: 01-新增, 上期.类别-会议: 变动通报, 本期.拟任人: 李四, 上期.拟任人: 李四, 本期.流程节点: 公司审批, 上期.流程节点: 部门评审}
    期望: {状态-会议: 02-进展更新}

  - 用例: T8 类别相同, 都没变, 按计划进行
    输入: {本期.类别-会议: 变动通报, 本期.状态-会议: 02-进展更新, 上期.类别-会议: 变动通报, 本期.拟任人: 周七, 上期.拟任人: 周七, 本期.流程节点: 公司审批, 上期.流程节点: 公司审批}
    期望: {状态-会议: 03-按计划进行}

  - 用例: T9 上期拟任人为空、本期有 = 新任命, 算变化
    输入: {本期.类别-会议: 变动通报, 本期.状态-会议: 01-新增, 上期.类别-会议: 变动通报, 本期.拟任人: 赵六}
    期望: {状态-会议: 02-进展更新}

  - 用例: T10 两期拟任人都空不算变化 (!= 两侧有空值就不成立, 与决策表一致)
    输入: {本期.类别-会议: 变动通报, 本期.状态-会议: 01-新增, 上期.类别-会议: 变动通报, 本期.流程节点: 部门评审, 上期.流程节点: 部门评审}
    期望: {状态-会议: 03-按计划进行}

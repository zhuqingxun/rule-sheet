# 与 规则_决策表.xlsx 完全相同的一组规则, 换成 YAML 写法。
# 两者由同一个解释器执行:  uv run rule-sheet run examples/status-machine/rules.yaml
#
# 这个样例展示三件事:
#   - 字段名含 `-` (类别-会议 / 状态-会议), 在表达式里直接写, 不用转义
#   - 输出格 `清空`: 命中后把目标列写成空值 (区别于不写 / "-" 的不改)
#   - 命中策略 `首次命中`: 每行只听优先级数字最小的那条, 命中即停, 后面的规则不再看这一行

匹配:
  左表: 本期岗位.xlsx
  右表: 上期岗位.xlsx
  左表别名: 本期
  右表别名: 上期
  匹配键: 岗位编码
  输出: output/本期岗位_更新后_yaml.xlsx

命中策略: 首次命中        # 每行只算优先级数字最小的那条命中; 同优先级按书写顺序

规则:
  - 编号: S1
    名称: 本期不再上会, 清掉状态
    优先级: 1
    当:
      - 为空(本期.类别-会议)
    则:
      状态-会议: 清空        # 写成空值; 不写这一列 (或写 "-") 才是不改

  - 编号: S2
    名称: 酝酿中的岗位由人工维护, 不处理
    优先级: 2
    当:
      - 本期.类别-会议 == "近2个月酝酿及上会计划"
    # 没有 则: 什么都不改, 但命中即停, S3 / S4 不再看这一行。
    # 换成 优先级 策略的话 S2 不占任何列, 这一行会被 S4 写成 01-新增 (用例 T2 守住这一点)。

  - 编号: S3
    名称: 类别与上期相同, 记为进展更新
    优先级: 3
    当:
      - 本期.类别-会议 == 上期.类别-会议      # 上期没有这个岗位时右边为空, 比较不成立
    则:
      状态-会议: 02-进展更新

  - 编号: S4
    名称: 其余有类别的岗位都是新增
    优先级: 4
    # 没有 当: 无条件命中; 首次命中 下只有前面都没命中的行才会走到这里 (兜底)
    则:
      状态-会议: 01-新增

# 测试用例: 与 Excel 的「测试」sheet 一致。期望里没写的列 = 期望不变; 写 清空 = 期望该列为空。
测试:
  - 用例: T1 类别为空, 清掉状态
    输入: {本期.状态-会议: 01-新增, 上期.类别-会议: 变动通报}
    期望: {状态-会议: 清空}

  - 用例: T2 酝酿中, S2 拦截不动
    输入: {本期.类别-会议: 近2个月酝酿及上会计划}
    期望: {}

  - 用例: T3 类别与上期相同, 进展更新
    输入: {本期.类别-会议: 变动通报, 本期.状态-会议: 01-新增, 上期.类别-会议: 变动通报}
    期望: {状态-会议: 02-进展更新}

  - 用例: T4 上期没有, 兜底新增
    输入: {本期.类别-会议: 变动通报}
    期望: {状态-会议: 01-新增}

  - 用例: T5 清空本来就空的格, 无变化
    输入: {}
    期望: {}

  - 用例: T6 类别变了, 重新计为新增
    输入: {本期.类别-会议: 变动通报, 本期.状态-会议: 02-进展更新, 上期.类别-会议: 近2个月酝酿及上会计划}
    期望: {状态-会议: 01-新增}

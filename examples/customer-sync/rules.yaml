# 与 规则_决策表.xlsx 完全相同的一组规则, 换成 YAML 写法。
# 两者由同一个解释器执行:  uv run rule-sheet run examples/customer-sync/rules.yaml
#
# 和决策表的差别: 条件不再是「单元格里的一元测试」, 而是完整的表达式,
# 每条一行, 全部满足才命中。表达式里可以直接写变量名、比较、函数。
# 相对路径以本文件所在目录为基准。

匹配:
  左表: 客户主表.xlsx
  右表: 本月流水.xlsx
  左表别名: 主表
  右表别名: 本月
  匹配键: 客户编号
  右表重复键: 取第一条
  基准日期: 2026-10-19
  输出: output/客户主表_更新后_yaml.xlsx

变量:
  偏差率: abs(本月.金额 - 主表.金额) / 主表.金额
  距上次活跃天数: 天数差(基准日期, 主表.上次活跃)

命中策略: 优先级        # 多条同时命中时, 每个输出列取优先级数字最小的那条

规则:
  - 编号: R1
    名称: 活跃客户金额偏差超 5% 需复核
    优先级: 1
    当:
      - 主表.状态 == "活跃"
      - 本月.存在 == 是
      - 偏差率 > 0.05
    则:
      复核标记: 待复核
      备注: 金额偏差超 5%

  - 编号: R2
    名称: 本月无流水且长期不活跃, 转休眠
    优先级: 2
    当:
      - 主表.状态 != "休眠"
      - 本月.存在 == 否
      - 距上次活跃天数 > 180
    则:
      状态: 休眠
      备注: 连续 6 个月无流水

  - 编号: R3
    名称: 本月电话与主表不同则覆盖
    优先级: 3
    当:
      - 本月.存在 == 是
      - 非空(本月.电话)
      - 非空(主表.电话)          # 决策表单元格的 != 自动忽略空值, YAML 表达式要自己判空, 否则「有值 != 空」为真
      - 本月.电话 != 主表.电话
    则:
      电话: 本月.电话          # 写变量名 = 复制该变量的值
      备注: 电话变更

  - 编号: R4
    名称: 高等级客户小幅偏差也要留意
    优先级: 4
    当:
      - 主表.状态 == "活跃"
      - 属于(主表.等级, "VIP", "金卡")
      - 偏差率 >= 0.02
      - 偏差率 <= 0.05
    则:
      备注: VIP 小幅偏差, 关注

  # 条件组合: 「当」下面的列表默认全部满足 (AND)。
  # 需要 OR 时写 任一满足:, 需要 NOT 时写 不满足:, 三者可以互相嵌套。
  # 这条规则在 Excel 决策表里对应 R5a / R5b 两行 (决策表没有 OR, 用多行表达)。
  - 编号: R5
    名称: 电话有缺失, 提醒补录
    优先级: 5
    当:
      - 本月.存在 == 是
      - 任一满足:
          - 为空(本月.电话)
          - 为空(主表.电话)
    则:
      提醒: 电话有缺失

# 测试用例: 与 Excel 的「测试」sheet 一致。期望里没写的列 = 期望不变。
测试:
  - 用例: T1 偏差 8% 触发 R1
    输入: {主表.状态: 活跃, 主表.等级: 普通, 偏差率: 0.08, 本月.存在: 是, 距上次活跃天数: 5, 主表.电话: "13800000001", 本月.电话: "13800000001"}
    期望: {复核标记: 待复核, 备注: 金额偏差超 5%}

  - 用例: T2 偏差 3% 普通客户不动
    输入: {主表.状态: 活跃, 主表.等级: 普通, 偏差率: 0.03, 本月.存在: 是, 距上次活跃天数: 5, 主表.电话: "13800000002", 本月.电话: "13800000002"}
    期望: {}

  - 用例: T3 本月缺失且 200 天触发 R2
    输入: {主表.状态: 活跃, 主表.等级: 普通, 本月.存在: 否, 距上次活跃天数: 200, 主表.电话: "13800000003"}
    期望: {状态: 休眠, 备注: 连续 6 个月无流水}

  - 用例: T4 已休眠不重复命中
    输入: {主表.状态: 休眠, 主表.等级: 普通, 本月.存在: 否, 距上次活跃天数: 400, 主表.电话: "13800000007"}
    期望: {}

  - 用例: T5 试用客户只换电话
    输入: {主表.状态: 试用, 主表.等级: 普通, 偏差率: 0.30, 本月.存在: 是, 距上次活跃天数: 3, 主表.电话: "13800000005", 本月.电话: "13900000005"}
    期望: {电话: "13900000005", 备注: 电话变更}

  - 用例: T6 金卡 4% 落在 R4 区间, 本月电话空同时触发 R5
    输入: {主表.状态: 活跃, 主表.等级: 金卡, 偏差率: 0.04, 本月.存在: 是, 距上次活跃天数: 10, 主表.电话: "13800000008"}
    期望: {备注: "VIP 小幅偏差, 关注", 提醒: 电话有缺失}     # 花括号写法里值含逗号必须加引号, 这正是 YAML 对非编码人员不友好的地方

  - 用例: T8 主表电话空也触发 R5 (任一满足的另一支)
    输入: {主表.状态: 活跃, 主表.等级: 普通, 偏差率: 0.01, 本月.存在: 是, 距上次活跃天数: 3, 本月.电话: "13800000009"}
    期望: {提醒: 电话有缺失}

  - 用例: T7 R1 与 R3 同时命中, 备注听 R1
    输入: {主表.状态: 活跃, 主表.等级: VIP, 偏差率: 0.08, 本月.存在: 是, 距上次活跃天数: 2, 主表.电话: "13800000006", 本月.电话: "13900000006"}
    期望: {电话: "13900000006", 复核标记: 待复核, 备注: 金额偏差超 5%}

# 与 规则_决策表.xlsx 完全相同的一组规则, 换成 YAML 写法。
# 两者由同一个解释器执行:  uv run rule-sheet run examples/candidate-rollup/rules.yaml
#
# 这个样例展示 0.7 加的「重复键: 拼接」(匹配层聚合):
#   - 参照表里同一个键的多行按 排序 接成一行, 每列各自接; 规则层仍然逐行, 输出格直接复制 推荐.工号 就是 E2;E1;E3
#   - 排序 空值一律排末尾; 空值占位 NA 让各列按位置对齐; 带序号 = 1.…;2.…; 分隔符 默认 ;
#   - 带输入前缀的派生变量 (推荐.现岗 / 冻结.期间) 在那张表自己的行上逐行算, 发生在聚合之前
#   - 拼接() 的列参数全空时为空 (再被占位成 NA), 部分空出 -经理-23级
#   - 测试用例里聚合后的变量直接给拼好的文本, 带前缀的派生变量也直接给值 (不推导)

输入:
  岗位: {文件: 岗位清单.xlsx, 匹配: 主表}                                                   # 主表
  推荐: {文件: 推荐记录.xlsx, 匹配: 岗位编码, 重复键: 拼接, 排序: 推荐时间 降序, 空值占位: NA}     # 一岗多行 -> 一行
  冻结: {文件: 冻结记录.xlsx, 匹配: 工号 = 岗位.现任工号, 重复键: 拼接, 排序: 冻结开始 降序, 带序号: 是}

变量:
  推荐.现岗: 拼接(推荐.现部门, "-", 推荐.现岗位, "-", 推荐.职级)   # 在推荐记录的每一行上算, 只能引用它自己的列
  冻结.期间: 拼接(冻结.冻结开始, "~", 冻结.冻结结束)

命中策略: 优先级        # 两条规则各管各的列

规则:
  - 编号: P1
    名称: 有推荐记录的岗位, 四列都是聚合后的文本
    优先级: 1
    当:
      - 推荐.存在 == 是
    则:
      拟任人工号: 推荐.工号          # E2;E1;E3
      拟任人姓名: 推荐.姓名
      拟任人现岗: 推荐.现岗          # -经理-23级;财务部-会计-22级;人事部-主管-21级
      推荐时间: 推荐.推荐时间        # 2026-10-01;2026-09-01;NA

  - 编号: F1
    名称: 现任者有冻结记录, 带序号
    优先级: 2
    当:
      - 冻结.存在 == 是
    则:
      冻结期间: 冻结.期间            # 1.2026-09-01~2026-09-30;2.2026-05-01~2026-05-31
      冻结依据: 冻结.冻结依据        # 1.审计;2.纪律

# 测试用例: 与 Excel 的「测试」sheet 一致。聚合后的变量直接给拼好的文本。
测试:
  - 用例: T1 三条推荐按推荐时间降序, 空值排末尾并占位
    输入: {推荐.存在: 是, 推荐.工号: E2;E1;E3, 推荐.姓名: 李四;张三;王五, 推荐.现岗: -经理-23级;财务部-会计-22级;人事部-主管-21级, 推荐.推荐时间: 2026-10-01;2026-09-01;NA, 冻结.存在: 否}
    期望: {拟任人工号: E2;E1;E3, 拟任人姓名: 李四;张三;王五, 拟任人现岗: -经理-23级;财务部-会计-22级;人事部-主管-21级, 推荐时间: 2026-10-01;2026-09-01;NA}

  - 用例: T2 都没有记录, 不动
    输入: {推荐.存在: 否, 冻结.存在: 否}
    期望: {}

  - 用例: T3 只有冻结记录
    输入: {推荐.存在: 否, 冻结.存在: 是, 冻结.期间: 1.2026-09-01~2026-09-30;2.2026-05-01~2026-05-31, 冻结.冻结依据: 1.审计;2.纪律}
    期望: {冻结期间: 1.2026-09-01~2026-09-30;2.2026-05-01~2026-05-31, 冻结依据: 1.审计;2.纪律}

  - 用例: T4 两条都命中, 各写各的列
    输入: {推荐.存在: 是, 推荐.工号: E5;E6, 推荐.姓名: 周七;吴八, 推荐.现岗: NA;研发部-工程师-20级, 推荐.推荐时间: 2026-07-01;2026-06-01, 冻结.存在: 是, 冻结.期间: 1.2026-08-10~, 冻结.冻结依据: 1.休假}
    期望: {拟任人工号: E5;E6, 拟任人姓名: 周七;吴八, 拟任人现岗: NA;研发部-工程师-20级, 推荐时间: 2026-07-01;2026-06-01, 冻结期间: 1.2026-08-10~, 冻结依据: 1.休假}

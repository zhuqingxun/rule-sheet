# 与 规则_决策表.xlsx 完全相同的一组规则, 换成 YAML 写法。
# 两者由同一个解释器执行:  uv run rule-sheet run examples/position-tags/rules.yaml
#
# 这个样例展示 0.6 加的几件事:
#   - 命中策略 多条拼接: 一个岗位可以同时命中多条规则, 「标签」列把它们按优先级顺序用 / 接起来 (多标签分类)
#   - 文本函数 包含 / 不包含 / 开头是 (按字面匹配, 任一命中即真, 空值不成立)
#   - 清单文件当参照表: 关键岗位清单.存在 = 这个岗位在不在清单里
#   - 数字(岗位.职级) 剥掉「级」后缀; 时长字面量 基准日期 - 365天
#   - 输出格里的 如果(条件, 真值, 假值) 与 拼接(...)
#   - (0.7) 规则内的分支 G6: 各支有各自的输出, 多条拼接 下成立的几支接起来

输入:
  岗位: {文件: 岗位清单.xlsx, 匹配: 主表}                 # 主表: 输出的行就是它的行
  关键岗位清单: {文件: 关键岗位清单.xlsx, 匹配: 岗位编码}   # 清单文件就是一个参照表, 按 岗位编码 对齐

设置:
  基准日期: 2026-10-01
  拼接分隔符: /                                      # 多条拼接 用的分隔符, 默认就是 /
  输出: output/岗位清单_更新后_yaml.xlsx

变量:
  职级数: 数字(岗位.职级)                              # 22级 / 23 / P23 -> 22 / 23 / 23; 取不到为空
  近一年推荐: 岗位.推荐时间 >= 基准日期 - 365天           # N天 是时长字面量; 推荐时间为空不成立

命中策略: 多条拼接        # 每个输出列把所有命中规则写的值按优先级顺序接起来 (DMN 的 Collect)

规则:
  - 编号: G1
    名称: 高管
    优先级: 1
    当:
      - 包含(岗位.岗位名称, "CEO", "总裁")      # 子串匹配; 「总裁助理」也含「总裁」, 要精确就用 开头是 / ==
    则:
      标签: 高管

  - 编号: G2
    名称: 直管
    优先级: 2
    当:
      - 开头是(岗位.一层组织, "2-", "3-")
      - 不包含(岗位.岗位名称, "助理")          # 空值也不成立 (与所有比较一致)
    则:
      标签: 直管

  - 编号: G3
    名称: 关键岗位
    优先级: 3
    当:
      - 关键岗位清单.存在 == 是
    则:
      标签: 关键岗位

  - 编号: G4
    名称: 高职级
    优先级: 4
    当:
      - 职级数 >= 23
    则:
      标签: 高职级

  - 编号: G5
    名称: 新推荐
    优先级: 5
    当:
      - 近一年推荐
    则:
      标签: 新推荐

  - 编号: G6
    名称: 职能
    优先级: 6
    # 规则内的分支 (0.7): 各支有各自的条件和输出, 规则整体计一次、审计记 G6。分支的合并方式跟随命中策略:
    # 多条拼接 下所有成立分支的值接起来 (5-职能平台 的 财务部-会计 是 职能平台/财务), 其它策略下取书写顺序第一个成立的分支
    分支:                     # 表达式里有逗号, 不能用 [ ] 流式写法 (YAML 会在逗号处拆开), 用块式
      - 当:
          - 开头是(岗位.一层组织, "5-")
        则: {职能: 职能平台}
      - 当:
          - 包含(岗位.岗位名称, "财务", "会计")
        则: {职能: 财务}
      - 当:
          - 包含(岗位.岗位名称, "法务")
        则: {职能: 法务}
      - 当:
          - 包含(岗位.岗位名称, "采购", "供应")
        则: {职能: 供应链}

  - 编号: G9
    名称: 显示名
    优先级: 9
    # 无条件; 多条拼接 下只有它写 显示名, 所以不发生拼接。如果() 是向量化三元, 条件为空走假分支
    则:
      显示名: '=如果(岗位.一层组织 != 空, 拼接(岗位.一层组织, "/", 岗位.岗位名称), 岗位.岗位名称)'

# 测试用例: 与 Excel 的「测试」sheet 一致。期望里没写的列 = 期望不变。
测试:
  - 用例: T1 两条命中, 按优先级顺序拼接
    输入: {岗位.岗位名称: 集团CEO, 岗位.一层组织: 1-集团总部, 关键岗位清单.存在: 否, 岗位.职级: 22级, 岗位.推荐时间: 2026-06-01}
    期望: {标签: 高管/新推荐, 显示名: 1-集团总部/集团CEO}

  - 用例: T2 名称含 助理, G2 不命中; 标签保持 普通
    输入: {岗位.岗位名称: 华东代表处-行政助理, 岗位.一层组织: 3-华东代表处, 关键岗位清单.存在: 否, 岗位.职级: 20级, 岗位.推荐时间: 2025-01-01, 岗位.标签: 普通}
    期望: {显示名: 3-华东代表处/华东代表处-行政助理}

  - 用例: T3 原标签 待定 被整体替换; 派生变量按定义推导
    输入: {岗位.岗位名称: 华东代表处-代表, 岗位.一层组织: 3-华东代表处, 关键岗位清单.存在: 是, 岗位.职级: 23级, 岗位.标签: 待定}
    期望: {标签: 直管/关键岗位/高职级, 显示名: 3-华东代表处/华东代表处-代表}

  - 用例: T4 一层组织为空, 显示名只有岗位名称; G6 只有 法务 一支成立
    输入: {岗位.岗位名称: 法务经理, 关键岗位清单.存在: 否, 岗位.职级: 19级, 岗位.推荐时间: 2026-02-01}
    期望: {标签: 新推荐, 显示名: 法务经理, 职能: 法务}

  - 用例: T5 P23 -> 23; 推荐超过一年不算新推荐
    输入: {岗位.岗位名称: 研发-SPDT主管, 岗位.一层组织: 4-研发体系, 关键岗位清单.存在: 是, 岗位.职级: P23, 岗位.推荐时间: 2024-12-31}
    期望: {标签: 关键岗位/高职级, 显示名: 4-研发体系/研发-SPDT主管}

  - 用例: T6 职级为空, 数字() 取不到, >= 23 不成立; G6 两支都成立 (5-职能平台 + 会计), 多条拼接 下接起来
    输入: {岗位.岗位名称: 财务部-会计, 岗位.一层组织: 5-职能平台, 关键岗位清单.存在: 否, 岗位.推荐时间: 2026-10-01}
    期望: {标签: 新推荐, 显示名: 5-职能平台/财务部-会计, 职能: 职能平台/财务}

  - 用例: T7 正好 365 天, >= 成立
    输入: {岗位.岗位名称: 供应链-采购经理, 岗位.一层组织: 6-供应链, 关键岗位清单.存在: 否, 岗位.职级: 22级, 岗位.推荐时间: 2025-10-01}
    期望: {标签: 新推荐, 显示名: 6-供应链/供应链-采购经理, 职能: 供应链}

  - 用例: T8 366 天, 不算; 标签不变
    输入: {岗位.岗位名称: 供应链-采购经理, 岗位.一层组织: 6-供应链, 关键岗位清单.存在: 否, 岗位.职级: 22级, 岗位.推荐时间: 2025-09-30}
    期望: {显示名: 6-供应链/供应链-采购经理, 职能: 供应链}

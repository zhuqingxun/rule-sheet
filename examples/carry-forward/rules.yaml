# 与 规则_决策表.xlsx 完全相同的一组规则, 换成 YAML 写法。
# 两者由同一个解释器执行:  uv run rule-sheet run examples/carry-forward/rules.yaml
#
# 这个样例展示 0.7 加的「字段组」:
#   - 字段组: 给一组列起个名字 (会议记录 = 六列), 则: 里写 会议记录: 上期 就是「组内每列从上期的同名列复制」;
#     写 清空 = 整组清空。加载时展开成逐列, 引擎、审计列、测试用例看到的都是逐列
#   - 同一条规则显式写了的列以显式为准: R1 整组带入但 例会时间 改成本批例会日, R3 整组带入但 状态-会议 标成 06
#   - 带入是整组同步: 上期某列为空, 本期该列也会被清成空 (用例 T5 的备注)
#   - 本批冒泡 是文本列, 条件里写 == "是" (加引号); 上期.存在 是布尔列, 写 == 是

输入:
  本期: {文件: 本期全量.xlsx, 匹配: 主表}            # 主表: 输出的行就是它的行
  上期: {文件: 上期全量.xlsx, 匹配: 岗位编码}         # 上一批次, 按 岗位编码 对齐; 上期.存在 = 上批有没有这个岗位

# 基准日期 = 本批例会日 (规则里 =基准日期 就是它), 每批不同, 不写在 设置: 里;
# 跑的时候给: --var 基准日期=2026-10-20 (Python: variables=), 没给取运行当天。内嵌测试的日期写在下面 测试: 里
设置:
  输出: output/本期全量_更新后_yaml.xlsx

字段组:
  会议记录: [例会时间, 类别-会议, 状态-会议, 例会结论, 备注, 待跟进事宜]   # 六列一个名字

命中策略: 首次命中        # 三条规则互斥; 不冒泡且上批没有记录的岗位什么都不动

规则:
  - 编号: R1
    名称: 本批冒泡且上批有记录, 整组带入, 例会时间改成本批
    优先级: 1
    当:
      - 本期.本批冒泡 == "是"
      - 上期.存在 == 是
    则:
      会议记录: 上期          # 展开成 例会时间: 上期.例会时间, 类别-会议: 上期.类别-会议, ... 六列
      例会时间: =基准日期     # 显式写的列优先于字段组里的同名列

  - 编号: R2
    名称: 首次冒泡
    优先级: 2
    当:
      - 本期.本批冒泡 == "是"
      - 上期.存在 == 否
    则:
      例会时间: =基准日期
      状态-会议: 01-新增

  - 编号: R3
    名称: 上批冒泡本批没冒泡且未关闭, 历史带入, 状态标 06
    优先级: 3
    当:
      - 本期.本批冒泡 == "否"
      - 上期.存在 == 是
      - 上期.状态-会议 != "05-已关闭"
    则:
      会议记录: 上期          # 例会时间也是上批的
      状态-会议: 06-本批未冒泡

# 测试用例: 与 Excel 的「测试」sheet 一致。期望里没写的列 = 期望不变; 写 空 = 期望该列为空。
# 基准日期: 用例是按这个日期写的 (T1 / T2 / T5 期望的例会时间就是它), 只给内嵌测试用, 生产换批次日期不影响用例
测试:
  基准日期: 2026-10-20
  用例:
    - 用例: T1 冒泡且上批有, 六列整组带入, 例会时间是本批的
      输入: {本期.本批冒泡: 是, 上期.存在: 是, 上期.例会时间: 2026-09-20, 上期.类别-会议: 变动通报, 上期.状态-会议: 02-进展更新, 上期.例会结论: 同意推进, 上期.备注: 候选人待定, 上期.待跟进事宜: 确认任命时间}
      期望: {例会时间: 2026-10-20, 类别-会议: 变动通报, 状态-会议: 02-进展更新, 例会结论: 同意推进, 备注: 候选人待定, 待跟进事宜: 确认任命时间}

    - 用例: T2 冒泡且上批没有, 首次冒泡
      输入: {本期.本批冒泡: 是, 上期.存在: 否}
      期望: {例会时间: 2026-10-20, 状态-会议: 01-新增}

    - 用例: T3 不冒泡且上批有未关闭记录, 整组带入, 例会时间是上批的, 状态标 06
      输入: {本期.本批冒泡: 否, 上期.存在: 是, 上期.例会时间: 2026-09-20, 上期.类别-会议: 变动通报, 上期.状态-会议: 03-按计划进行, 上期.例会结论: 按计划, 上期.待跟进事宜: 跟进到位情况}
      期望: {例会时间: 2026-09-20, 类别-会议: 变动通报, 状态-会议: 06-本批未冒泡, 例会结论: 按计划, 待跟进事宜: 跟进到位情况}

    - 用例: T4 不冒泡且上批没有, 不动
      输入: {本期.本批冒泡: 否, 上期.存在: 否}
      期望: {}

    - 用例: T5 本期备注原来有值、上期为空, 整组带入会把它清成空
      输入: {本期.本批冒泡: 是, 上期.存在: 是, 上期.例会时间: 2026-09-20, 上期.类别-会议: 变动通报, 上期.状态-会议: 03-按计划进行, 上期.例会结论: 面谈通过, 上期.待跟进事宜: 走审批, 本期.备注: 临时备注}
      期望: {例会时间: 2026-10-20, 类别-会议: 变动通报, 状态-会议: 03-按计划进行, 例会结论: 面谈通过, 备注: 空, 待跟进事宜: 走审批}

    - 用例: T6 不冒泡且上批已关闭, R3 不成立, 不动
      输入: {本期.本批冒泡: 否, 上期.存在: 是, 上期.类别-会议: 变动通报, 上期.状态-会议: 05-已关闭, 上期.例会结论: 已任命}
      期望: {}
